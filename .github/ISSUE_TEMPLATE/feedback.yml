name: Feedback
description: An idea, a gripe, or something that works well.
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public as soon as you post it. Leave out names, addresses and message text you wouldn't post openly.

        For updates in meshage, send MeshageBot `follow #N` with this issue's number once it's posted. No GitHub account? Use Bug Report in the app's menu and Send to MeshageBot instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The app menu's About sheet shows it.
      placeholder: 0.4.10+24
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Phone or computer, and its OS version.
      placeholder: Android 15, Pixel 8
  - type: textarea
    id: details
    attributes:
      label: Feedback
    validations:
      required: true
