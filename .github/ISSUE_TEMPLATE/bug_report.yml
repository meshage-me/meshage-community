name: Bug report
description: Something in meshage doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public as soon as you post it. Leave out names, addresses and message text you wouldn't post openly.
  - type: input
    id: version
    attributes:
      label: Version
      description: The app menu's About sheet shows it.
      placeholder: 0.4.10+24
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Phone or computer, and its OS version.
      placeholder: Android 15, Pixel 8
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: The radio or interface involved, logs, screenshots.
